global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: echofox-local

scrape_configs:
  - job_name: echofox-supervisor
    scheme: http
    metrics_path: /metrics
    static_configs:
      - targets: ['echofox:3000']
        labels:
          service: echofox
          job_part: supervisor
          env: production

  - job_name: echofox-dashboard
    scheme: http
    metrics_path: /metrics
    # basic_auth belongs to the scrape JOB, not static_configs.
    # Prometheus does NOT expand arbitrary ${ENV} in YAML. Match this username
    # to config.dashboard.username; provision the password through the mounted
    # secret file. It must be readable by the Prometheus container UID 65534.
    basic_auth:
      username: admin
      password_file: /run/secrets/metrics_dashboard_password
    static_configs:
      - targets: ['echofox:3001']
        labels:
          service: echofox
          job_part: dashboard
          env: production

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
