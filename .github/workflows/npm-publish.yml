name: npm publish

# Publishing requires complete local gates and the actual packed artifact.
# Authentication/policy errors fail explicitly; do not weaken account 2FA.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2 # need HEAD~1 for the version-bump diff

      - name: Decide whether to publish
        id: decide
        run: |
          # Tag pushes + manual: always publish.
          # Push-to-main: only publish if package.json version changed.
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "publish=true" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "publish=true" >> $GITHUB_OUTPUT
          else
            CURRENT=$(node -p "require('./package.json').version")
            # Missing history/invalid JSON is a failure, not an invented 0.0.0.
            git show HEAD~1:package.json > "$RUNNER_TEMP/echofox-previous-package.json"
            PREVIOUS=$(node -e "const fs=require('node:fs'); const p=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); if(typeof p.version!=='string'||!p.version) throw new Error('Previous package version missing'); console.log(p.version)" "$RUNNER_TEMP/echofox-previous-package.json")
            if [ "$CURRENT" != "$PREVIOUS" ]; then
              echo "publish=true" >> $GITHUB_OUTPUT
              echo "🔼 version bumped: $PREVIOUS → $CURRENT — publishing"
            else
              echo "publish=false" >> $GITHUB_OUTPUT
              echo "⏭️  no version change on main — skipping npm publish"
            fi
          fi

      - name: Setup Node.js
        if: steps.decide.outputs.publish == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        if: steps.decide.outputs.publish == 'true'
        run: npm ci

      - name: Required publish gates
        if: steps.decide.outputs.publish == 'true'
        run: |
          npm run lint
          npm run format:check
          npm run headers:check
          npm run license:check
          npm test
          npm run test:contract
          npm run secrets:check
          npm run build:dashboard
          npm run audit:production

      - name: Resolve version
        id: ver
        if: steps.decide.outputs.publish == 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "v${VERSION}" != "${TAG}" ]]; then
            echo "::error::package.json version (${VERSION}) does not match pushed tag (${TAG})"
            exit 1
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Check if version already published
        id: check
        if: steps.decide.outputs.publish == 'true'
        run: node scripts/check-published.js >> "$GITHUB_OUTPUT"

      - name: Pack and verify actual package
        if: steps.decide.outputs.publish == 'true' && steps.check.outputs.already == 'false'
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          node scripts/check-package.js "$RUNNER_TEMP/echofox-${{ steps.ver.outputs.version }}.tgz"

      - name: Pre-publish authentication diagnostics
        if: steps.decide.outputs.publish == 'true' && steps.check.outputs.already == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not configured. Owner must review granular-token permissions or configure trusted publishing."
            exit 1
          fi
          # Never print token lengths, token inventories, or raw credentials.
          # A failure may be registry/network/auth/account policy, not just expiry.
          npm whoami

      - name: Publish to npm (with provenance)
        id: publish
        if: steps.decide.outputs.publish == 'true' && steps.check.outputs.already == 'false'
        run: npm publish "$RUNNER_TEMP/echofox-${{ steps.ver.outputs.version }}.tgz" --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish confirmation
        if: steps.publish.outcome == 'success'
        run: echo "Published verified echofox@${{ steps.ver.outputs.version }} package with provenance."
