name: Docker

# v1.11.0:
#   - tag-trigger: pushing a v* tag still builds + publishes (legacy path)
#   - push-to-main fallback: detects version change in package.json and builds
#     the image with that version (matches release.yml behaviour)
#   - schedule: weekly rebuild to absorb base-image security patches
on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2 # need HEAD~1 for the version-bump diff

      - name: Decide whether to build
        id: decide
        run: |
          # Tag pushes + schedule + manual: always build.
          # Push-to-main: only build if package.json version changed.
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" || "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "build=true" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "build=true" >> $GITHUB_OUTPUT
          else
            # Push to main — check for version bump
            CURRENT=$(node -p "require('./package.json').version")
            # Missing history is not evidence of a version bump.
            git show HEAD~1:package.json > "$RUNNER_TEMP/echofox-previous-package.json"
            PREVIOUS=$(node -e "const fs=require('node:fs'); const p=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); if(typeof p.version!=='string'||!p.version) throw new Error('Previous package version missing'); console.log(p.version)" "$RUNNER_TEMP/echofox-previous-package.json")
            if [ "$CURRENT" != "$PREVIOUS" ]; then
              echo "build=true" >> $GITHUB_OUTPUT
              echo "🔼 version bumped: $PREVIOUS → $CURRENT — building"
            else
              echo "build=false" >> $GITHUB_OUTPUT
              echo "⏭️  no version change on main — skipping Docker build"
            fi
          fi

      - name: Get version
        id: version
        if: steps.decide.outputs.build == 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "::error::Tag version does not match package.json"
            exit 1
          fi
          MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1-2)
          SHORT_SHA=${GITHUB_SHA::7}
          echo "version=$VERSION"             >> $GITHUB_OUTPUT
          echo "major_minor=$MAJOR_MINOR"     >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA"         >> $GITHUB_OUTPUT

      # Local hardening only: this does NOT enable a remotely disabled workflow.
      - name: Setup Node.js for required gates
        if: steps.decide.outputs.build == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: steps.decide.outputs.build == 'true'
        run: npm ci

      - name: Required container publication gates
        if: steps.decide.outputs.build == 'true'
        run: |
          npm run lint
          npm run format:check
          npm run headers:check
          npm run license:check
          npm test
          npm run test:contract
          npm run secrets:check
          npm run build:dashboard
          npm run audit:production

      - name: Set up Docker Buildx
        if: steps.decide.outputs.build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GitHub Container Registry
        if: steps.decide.outputs.build == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: ${{ steps.decide.outputs.build == 'true' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push (GHCR)
        if: steps.decide.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/cosm1cbug/echofox:${{ steps.version.outputs.version }}
            ghcr.io/cosm1cbug/echofox:${{ steps.version.outputs.major_minor }}
            ghcr.io/cosm1cbug/echofox:sha-${{ steps.version.outputs.short_sha }}
            ghcr.io/cosm1cbug/echofox:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (Docker Hub)
        if: ${{ steps.decide.outputs.build == 'true' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            cosm1cbug/echofox:${{ steps.version.outputs.version }}
            cosm1cbug/echofox:${{ steps.version.outputs.major_minor }}
            cosm1cbug/echofox:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
