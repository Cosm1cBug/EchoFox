name: Release

# v1.4.0:
#   - tag-trigger: pushing a v* tag (e.g. v1.4.0) creates a release immediately
#   - push-to-main fallback: detects version change in package.json and creates
#     a release with the matching v<version> tag
#   - runs tests + headers check before publishing
#   - prefers RELEASE_NOTES_v<version>.md body; falls back to auto-generated notes
#   - attaches a source tarball (src + dashboard + LICENSE + README + CHANGELOG)
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Required local quality gates
        run: |
          npm run lint
          npm run format:check
          npm run headers:check
          npm run license:check
          npm test
          npm run test:contract
          npm run secrets:check

      - name: Check AGPL headers (gate the release)
        run: npm run headers:check

      - name: Resolve target version
        id: target
        run: |
          # Tag pushes: use the tag (strip leading v); push-to-main: read package.json
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            SOURCE="tag"
            PACKAGE_VERSION=$(node -p "require('./package.json').version")
            if [[ "$VERSION" != "$PACKAGE_VERSION" ]]; then
              echo "::error::Tag version does not match package.json"
              exit 1
            fi
          else
            VERSION=$(node -p "require('./package.json').version")
            TAG="v${VERSION}"
            SOURCE="package"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}"         >> $GITHUB_OUTPUT
          echo "source=${SOURCE}"   >> $GITHUB_OUTPUT
          echo "Releasing ${TAG} (source: ${SOURCE})"

      - name: Detect version bump (push-to-main path only)
        id: bump
        if: steps.target.outputs.source == 'package'
        run: |
          CURRENT="${{ steps.target.outputs.version }}"
          # Missing history/invalid JSON is a failure, not an invented 0.0.0.
          git show HEAD~1:package.json > "$RUNNER_TEMP/echofox-previous-package.json"
          PREVIOUS=$(node -e "const fs=require('node:fs'); const p=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); if(typeof p.version!=='string'||!p.version) throw new Error('Previous package version missing'); console.log(p.version)" "$RUNNER_TEMP/echofox-previous-package.json")
          if [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "changed=true"  >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Decide whether to release
        id: decide
        run: |
          if [[ "${{ steps.target.outputs.source }}" == "tag" ]]; then
            echo "release=true" >> $GITHUB_OUTPUT
          elif [[ "${{ steps.bump.outputs.changed }}" == "true" ]]; then
            echo "release=true" >> $GITHUB_OUTPUT
          else
            echo "release=false" >> $GITHUB_OUTPUT
            echo "No version change and no tag push — skipping release."
          fi

      - name: Build dashboard
        if: steps.decide.outputs.release == 'true'
        run: |
          npm run build:dashboard
          npm run audit:production
          npm pack --pack-destination "$RUNNER_TEMP"
          node scripts/check-package.js "$RUNNER_TEMP/echofox-${{ steps.target.outputs.version }}.tgz"

      - name: Prepare release notes body
        id: notes
        if: steps.decide.outputs.release == 'true'
        run: |
          NOTES_FILE="RELEASE_NOTES_${{ steps.target.outputs.tag }}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "use_file=true" >> $GITHUB_OUTPUT
            echo "file=$NOTES_FILE" >> $GITHUB_OUTPUT
          else
            echo "use_file=false" >> $GITHUB_OUTPUT
            echo "No $NOTES_FILE — will use GitHub's auto-generated notes"
          fi

      - name: Build source tarball
        if: steps.decide.outputs.release == 'true'
        run: |
          TARBALL="echofox-${{ steps.target.outputs.version }}.tar.gz"
          git ls-files -z > "$RUNNER_TEMP/echofox-release-files"
          tar --exclude='src/config.js' --exclude='src/@session' \
              --exclude='data' --exclude='*.db' --exclude='*.db-*' \
              --null -czf "$TARBALL" -T "$RUNNER_TEMP/echofox-release-files" src/dashboard/react
          # Both lockfiles and ALL frontend build inputs are tracked and included.
          tar -tzf "$TARBALL" > "$RUNNER_TEMP/echofox-release-manifest"
          for required in package-lock.json dashboard/package-lock.json dashboard/tsconfig.app.json dashboard/tsconfig.node.json src/dashboard/react/index.html; do
            grep -Fx "$required" "$RUNNER_TEMP/echofox-release-manifest"
          done
          ls -lh "$TARBALL"

      - name: Create GitHub Release
        if: steps.decide.outputs.release == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.target.outputs.tag }}
          name: Release ${{ steps.target.outputs.tag }}
          body_path: ${{ steps.notes.outputs.use_file == 'true' && steps.notes.outputs.file || '' }}
          generate_release_notes: ${{ steps.notes.outputs.use_file != 'true' }}
          draft: false
          prerelease: ${{ contains(steps.target.outputs.version, 'beta') || contains(steps.target.outputs.version, 'alpha') || contains(steps.target.outputs.version, 'rc') }}
          files: echofox-${{ steps.target.outputs.version }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
