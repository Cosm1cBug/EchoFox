global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: echofox-local

scrape_configs:
  - job_name: echofox
    # v1.4.0: scrape both the supervisor (process + worker_up) and the
    # dashboard (store-backed AI/Telegram/command counters + gauges)
    scheme: http
    metrics_path: /metrics
    static_configs:
      - targets: ['echofox:3000']
        labels:
          service: echofox
          job_part: supervisor
          env: production
      # NOTE: /metrics on :3001 sits behind the dashboard's HTTP Basic Auth
      # (src/dashboard/server.js applies basicAuth() to every route when
      # config.dashboard.username is set). This target therefore returns 401
      # and shows as DOWN unless you give Prometheus credentials. Two options:
      #
      #   A. Keep auth — add the block below and create the password file:
      #        basic_auth:
      #          username: admin
      #          password_file: /etc/prometheus/dashboard_password
      #      then mount it:  -v ./docker/prometheus/dashboard_password:/etc/prometheus/dashboard_password:ro
      #
      #   B. Exempt /metrics from basicAuth in startDashboard() and rely on
      #      the compose port binding (127.0.0.1:3001) for safety.
      - targets: ['echofox:3001']
        labels:
          service: echofox
          job_part: dashboard
          env: production

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
